name: CI

# Runs on every push + every PR to main. Two independent jobs run in parallel:
#   backend  → Maven verify (unit + slice + integration tests, JaCoCo gate)
#   frontend → npm run build + lint (TypeScript check happens inside build)
# Both must pass before merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # `verify` runs tests + the JaCoCo coverage-check rule. Testcontainers
      # spins up Postgres on the fly; WireMock boots in-process. No external
      # services needed.
      - name: Maven verify
        run: ./mvnw -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` performs the TypeScript compile + static analysis.
      # A clean build is our type-safety gate.
      - name: Build
        run: npm run build
