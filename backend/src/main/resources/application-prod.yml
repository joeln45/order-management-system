# ==============================================================
# Prod profile — real PostgreSQL database.
# Activated with: --spring.profiles.active=prod
#
# Connection details default to the local docker-compose Postgres,
# but can (and should) be overridden via environment variables in
# real deployments — never commit real secrets to git.
# ==============================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oms}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: WARN
