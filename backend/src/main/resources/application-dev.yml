# ==============================================================
# Dev profile — H2 in-memory DB for fast iteration with no external dependencies.
# Activated by default (see application.yml: spring.profiles.default).
# ==============================================================
spring:
  datasource:
    url: jdbc:h2:mem:ordermanagement;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # 'validate' = fail at startup if entity classes don't match the DB schema.
      # The schema itself is owned by Flyway migrations — Hibernate must not auto-generate.
      ddl-auto: validate
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: DEBUG
