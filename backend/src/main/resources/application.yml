spring:
  application:
    name: order-management

  # 'dev' is the default profile when none is specified.
  # Activate explicitly with: --spring.profiles.active=prod
  profiles:
    default: dev

  jpa:
    open-in-view: false        # disables the anti-pattern that warns at startup
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    root: WARN
    org.springframework.web: INFO
    org.springframework.boot: INFO
    com.joel.ordermanagement: INFO
    org.hibernate: WARN

# --------------------------------------------------------------
# Application-specific config (read with @Value or @ConfigurationProperties)
# --------------------------------------------------------------
wholesaler:
  base-url: https://pmaier.eu.pythonanywhere.com/wss
  connect-timeout: PT2S     # TCP handshake budget
  response-timeout: PT5S    # HTTP response budget
  retry:
    max-attempts: 3
    initial-backoff: PT0.5S
    max-backoff: PT2S

# --------------------------------------------------------------
# Authentication
#
# `secret` must be at least 32 chars (HMAC-SHA256 requires a 256-bit key).
# The default here is fine for dev; production MUST override via the
# APP_JWT_SECRET env var (docker-compose/CI).
# --------------------------------------------------------------
app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-at-least-32-characters-long-please}
    access-token-ttl: PT15M    # ISO-8601 duration → 15 minutes
    refresh-token-ttl: P7D     # 7 days
    issuer: order-management

  # Seeded credentials for local dev only; production disables the seeder.
  seed:
    enabled: true
    operator-username: operator
    operator-password: password123
    demo-customer-username: customer
    demo-customer-password: password123

# --------------------------------------------------------------
# springdoc / Swagger UI
# --------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha      # GET/POST/... alphabetically within a tag
    tags-sorter: alpha            # tags alphabetically in the sidebar
    try-it-out-enabled: true
    display-request-duration: true
  # Group endpoints under /swagger-ui.html?group=... if we ever split them.
  show-actuator: false
