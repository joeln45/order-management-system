spring:
  application:
    name: order-management

  # 'dev' is the default profile when none is specified.
  # Activate explicitly with: --spring.profiles.active=prod
  profiles:
    default: dev

  jpa:
    open-in-view: false        # disables the anti-pattern that warns at startup
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    root: WARN
    org.springframework.web: INFO
    org.springframework.boot: INFO
    com.joel.ordermanagement: INFO
    org.hibernate: WARN

# --------------------------------------------------------------
# Application-specific config (read with @Value or @ConfigurationProperties)
# --------------------------------------------------------------
wholesaler:
  base-url: https://pmaier.eu.pythonanywhere.com/wss
