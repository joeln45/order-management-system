spring:
  application:
    name: order-management

  datasource:
    url: jdbc:h2:mem:ordermanagement
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false        # disables anti-pattern that warns at startup
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    root: WARN
    org.springframework.web: INFO
    org.springframework.boot: INFO
    com.joel.ordermanagement: INFO
    org.hibernate: WARN
    org.hibernate.SQL: 'OFF'

# --------------------------------------------------------------
# Application-specific config (read with @Value or @ConfigurationProperties)
# --------------------------------------------------------------
wholesaler:
  base-url: https://pmaier.eu.pythonanywhere.com/wss
